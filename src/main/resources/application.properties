# ---- Database (PostgreSQL) ----
# Change the password below, or set the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lost_found_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Run schema.sql on every start (it only creates tables if they do not exist)
spring.sql.init.mode=always

# ---- Web ----
server.port=8081
spring.thymeleaf.cache=false